<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanya AI</title>
<style>
  :root{
    --bg:#f6f8fb; --surface:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e4e9f0;
    --accent:#0d9488; --accent-ink:#ffffff; --soft:#eef2f7; --err:#dc2626; --shadow:0 4px 20px rgba(15,23,42,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0b1020; --surface:#121a2e; --ink:#e8eefc; --muted:#8a97b8; --line:#222c47; --soft:#18223a; --err:#f87171; --shadow:0 4px 20px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-theme="dark"]){
      --bg:#0b1020; --surface:#121a2e; --ink:#e8eefc; --muted:#8a97b8; --line:#222c47; --soft:#18223a; --err:#f87171; --shadow:0 4px 20px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer;color:inherit}
  .hide{display:none!important}
  .shell{display:flex;height:100dvh}

  /* ---- Sidebar riwayat ---- */
  .side{width:280px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:max(14px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));gap:10px}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .brand h1{font-size:1.05rem;margin:0;letter-spacing:-.01em}
  .mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;flex:none}
  .btn{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.86rem}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .side-label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px 0}
  .hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
  .hi{display:flex;align-items:center;border-radius:10px}
  .hi:hover,.hi.active{background:var(--soft)}
  .hi .ht{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 10px;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hi.active .ht{font-weight:600}
  .hi .hd{background:none;border:0;color:var(--muted);padding:6px 10px;font-size:1.05rem;line-height:1;opacity:0}
  .hi:hover .hd,.hi:focus-within .hd{opacity:1}
  @media (hover:none){.hi .hd{opacity:.7}}
  .empty-h{color:var(--muted);font-size:.84rem;padding:8px 10px}
  .side-foot{display:flex;gap:8px;flex-wrap:wrap}
  .side-foot .btn{flex:1;font-size:.8rem;padding:7px 8px}
  .scrim{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:9}

  /* ---- Kolom utama ---- */
  .col{flex:1;display:flex;flex-direction:column;min-width:0;
    background:radial-gradient(900px 320px at 50% -80px,color-mix(in srgb,var(--accent) 9%,transparent),transparent)}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
    background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .ib2{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;flex:none;display:grid;place-items:center}
  .ib2:hover{border-color:var(--accent)}
  .htxt{flex:1;min-width:0}
  #ttl{font-weight:600;font-size:.98rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #menu{display:none}

  .panel{margin:10px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));box-shadow:var(--shadow)}
  .panel label,.panel .lbl{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted)}
  .panel input,.panel select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:.95rem;min-width:0}
  .panel input:focus,.panel select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .panel select option,.panel select optgroup{background:var(--surface);color:var(--ink)}
  .panel .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem;grid-column:1/-1}
  .panel .chk input{width:18px;height:18px;padding:0;accent-color:var(--accent)}
  .legend{grid-column:1/-1;margin:0;font-size:.76rem;color:var(--muted)}
  .sw{display:flex;gap:10px;padding:6px 0}
  .sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
  .sw button[aria-checked="true"]{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--ink)}

  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .wrap{max-width:780px;margin:0 auto;padding:24px 18px;display:flex;flex-direction:column;gap:24px;min-height:100%}

  .hero{margin:auto;text-align:center;max-width:520px;padding:16px 0;width:100%}
  .hero .mark{width:56px;height:56px;border-radius:18px;font-size:28px;margin:0 auto 16px;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
  .hero h2{margin:0 0 6px;font-size:1.75rem;letter-spacing:-.025em}
  .hero p{margin:0 0 22px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card .ci{font-size:22px;margin-bottom:4px}
  .card b{font-size:.92rem}.card small{color:var(--muted);font-size:.78rem}

  .row{display:flex;gap:12px;align-items:flex-start}
  .row.user{justify-content:flex-end}
  .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;margin-top:2px}
  .body{min-width:0;max-width:100%}
  .row.user .body{max-width:82%}
  .msg{overflow-wrap:anywhere}
  .user .msg{background:var(--accent);color:var(--accent-ink);padding:10px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap}
  .ai .msg p{margin:0 0 .6em}.ai .msg p:last-child{margin-bottom:0}
  .ai .msg h4{margin:.9em 0 .3em;font-size:1rem}
  .ai .msg ul,.ai .msg ol{margin:.3em 0 .7em;padding-left:1.3em}
  .ai .msg code{background:var(--soft);border-radius:5px;padding:1px 5px;font-size:.88em}
  .ai .msg pre{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;margin:.5em 0}
  .ai .msg pre code{background:none;padding:0}
  .err .av{background:var(--err)}
  .err .msg{color:var(--err)}
  .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .acts button{background:none;border:0;color:var(--muted);font-size:.78rem;padding:3px 8px;border-radius:8px}
  .acts button:hover{background:var(--soft);color:var(--ink)}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{max-width:120px;max-height:120px;border-radius:10px;object-fit:cover}
  .thumbs .file{background:rgba(255,255,255,.22);border-radius:8px;padding:2px 8px;font-size:.78rem}
  .gen{max-width:100%;border-radius:14px;display:block}
  .files{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-width:420px}
  .fc{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
  .fc .ic{font-size:22px}
  .fc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
  .fc .nm small{display:block;color:var(--muted);font-size:.74rem}
  .fc button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:7px 12px;font-size:.84rem;flex:none}
  .fc button:disabled{opacity:.6}
  .fc.all{border-style:dashed}
  .dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

  .dock{padding:6px 16px max(14px,env(safe-area-inset-bottom))}
  .dockin{max-width:780px;margin:0 auto}
  .modebar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .modes{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
  .modes button{background:transparent;border:0;border-radius:999px;padding:5px 13px;font-size:.84rem;color:var(--muted)}
  .modes button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .modehint{font-size:.76rem;color:var(--muted)}
  .att{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .att:empty{display:none}
  .pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.8rem;max-width:230px}
  .pill img{width:28px;height:28px;object-fit:cover;border-radius:6px}
  .pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill button{background:none;border:0;color:var(--muted);font-size:1.05rem;line-height:1;padding:0 2px}
  .composer{display:flex;align-items:flex-end;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 8px;box-shadow:var(--shadow)}
  .composer:focus-within{border-color:var(--accent)}
  textarea{flex:1;resize:none;max-height:150px;background:transparent;color:var(--ink);border:0;outline:0;padding:9px 6px;font:inherit}
  .ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:19px;flex:none;color:var(--muted)}
  .ib:hover{background:var(--soft)}
  .ib.on{background:var(--soft);color:var(--accent)}
  .ib.rec{background:var(--err);color:#fff}
  .send{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:17px;flex:none}
  .send:disabled{opacity:.45;cursor:not-allowed}
  .foot{margin:6px 0 0;text-align:center;font-size:.72rem;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(560px,92vw);
    background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.85rem;z-index:20;white-space:pre-line}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  @media (max-width:860px){
    .side{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);width:min(300px,86vw)}
    .side.open{transform:none}
    #menu{display:grid}
    .cards{grid-template-columns:1fr 1fr}
  }
  @media (max-width:420px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Riwayat chat">
    <div class="brand"><div class="mark">✦</div><h1>Tanya AI</h1></div>
    <button class="btn primary" id="reset" type="button">＋ Chat baru</button>
    <div class="side-label">Riwayat</div>
    <nav class="hist" id="hist"></nav>
    <div class="side-foot">
      <button class="btn" id="export" type="button">⬇ Ekspor</button>
      <button class="btn" id="clearall" type="button">🗑 Hapus semua</button>
    </div>
  </aside>
  <div class="scrim hide" id="scrim"></div>

  <div class="col">
    <header>
      <button class="ib2" id="menu" type="button" aria-label="Buka riwayat">☰</button>
      <div class="htxt"><div id="ttl">Chat baru</div><div class="sub" id="sub">-</div></div>
      <button class="ib2" id="newTop" type="button" aria-label="Chat baru" title="Chat baru">＋</button>
      <button class="ib2" id="gear" type="button" aria-label="Pengaturan" aria-expanded="false" aria-controls="panel" title="Pengaturan">⚙</button>
    </header>

    <section class="panel hide" id="panel">
      <label>Nama kamu<input id="name" maxlength="40" placeholder="Contoh: Sultan" autocomplete="given-name"></label>
      <label>Model AI<select id="model"><option value="auto-FREE">auto-FREE</option></select></label>
      <label>Peran AI<select id="persona">
        <option value="umum">Asisten umum</option><option value="tutor">Tutor sabar</option><option value="coder">Programmer</option>
        <option value="penulis">Penulis</option><option value="penerjemah">Penerjemah</option><option value="bisnis">Konsultan bisnis</option>
        <option value="kuliah">Pembimbing tugas kuliah</option></select></label>
      <label>Tema<select id="theme"><option value="auto">Otomatis</option><option value="light">Terang</option><option value="dark">Gelap</option></select></label>
      <div class="lbl">Warna aksen<div class="sw" id="swatches" role="radiogroup" aria-label="Warna aksen"></div></div>
      <label class="hide" id="sizeBox">Ukuran gambar<select id="size"></select></label>
      <label class="hide" id="editBox">Model edit gambar<select id="editModel"></select></label>
      <label class="chk"><input type="checkbox" id="stream" checked> Jawaban realtime (teks muncul langsung)</label>
      <p class="legend" id="legend">👁 bisa membaca gambar · ✏️ bisa mengedit gambar · 🎨 bisa membuat gambar</p>
    </section>

    <main id="mainScroll"><div class="wrap" id="log" aria-live="polite"></div></main>

    <div class="dock"><div class="dockin">
      <div class="modebar">
        <div class="modes" id="modes" role="radiogroup" aria-label="Gaya jawaban">
          <button type="button" role="radio" data-mode="biasa" aria-checked="true">⚖ Biasa</button>
          <button type="button" role="radio" data-mode="cepat" aria-checked="false">⚡ Cepat</button>
          <button type="button" role="radio" data-mode="kritis" aria-checked="false">🔍 Kritis</button>
        </div>
        <span class="modehint" id="modehint"></span>
      </div>
      <div class="att" id="att"></div>
      <form class="composer" id="form">
        <input type="file" id="file" class="hide" multiple>
        <button class="ib" id="attach" type="button" aria-label="Lampirkan file atau gambar" title="Lampirkan gambar, PDF, Word, ZIP, atau file teks/kode">📎</button>
        <button class="ib hide" id="editmode" type="button" aria-label="Mode edit gambar" title="Edit gambar dengan AI (lampirkan gambar dulu)">✏️</button>
        <button class="ib hide" id="imgmode" type="button" aria-label="Mode buat gambar" title="Mode buat gambar">🎨</button>
        <textarea id="input" rows="1" placeholder="Tulis pesan…" aria-label="Pesan"></textarea>
        <button class="ib hide" id="mic" type="button" aria-label="Dikte suara" title="Dikte suara (Bahasa Indonesia)">🎤</button>
        <button class="send" id="send" type="submit" aria-label="Kirim">➤</button>
      </form>
      <p class="foot">AI bisa keliru. Periksa kembali informasi penting.</p>
    </div></div>
  </div>
</div>
<div class="toast hide" id="toast" role="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), scroller = $("mainScroll"), input = $("input"), send = $("send"), nameEl = $("name"), modelSel = $("model"), sub = $("sub");

  const LIB = {
    pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
    pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
    docx: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js",
    zip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
    jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  };
  const MODES = {
    biasa: "Jawaban seimbang dan natural.",
    cepat: "Singkat, langsung ke inti.",
    kritis: "Memeriksa asumsi, risiko, dan alternatif."
  };
  const MAX_FILE_MB = 30;          // batas membaca file di browser
  const TEXT_LIMIT = 100000;       // batas karakter teks per file yang dikirim
  const TOTAL_TEXT_LIMIT = 130000; // total semua lampiran per pesan
  const MAX_IMAGES = 5;
  const SIZES = ["512x512", "1024x1024", "1024x1792", "1792x1024"];
  const MAX_BODY = 4200000;        // batas aman permintaan Vercel (~4,5 MB)
  const TEXT_EXT = /\.(txt|md|csv|tsv|json|js|jsx|ts|tsx|py|html|htm|css|scss|java|kt|c|h|cpp|cs|go|rs|rb|php|sql|xml|yml|yaml|toml|ini|env|sh|bat|log|vue|svelte|r|swift|dart|lua)$/i;

  const fmt = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  let history = [], pending = [], imageMode = false, editMode = false, mode = "biasa", toastTimer, convs = [], cur = null;

  function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.remove("hide");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hide"), 7000);
  }
  const libs = {};
  function loadScript(url){
    return libs[url] || (libs[url] = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = url; s.onload = res;
      s.onerror = () => { delete libs[url]; rej(new Error("Gagal memuat pustaka pembaca file (cek koneksi internet).")); };
      document.head.appendChild(s);
    }));
  }

  // ---------- Markdown ringan (aman: HTML di-escape dulu) ----------
  function md(src){
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const blocks = [];
    let t = esc(src).replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, c) => { blocks.push(c.replace(/\n$/, "")); return "\u0000" + (blocks.length - 1) + "\u0000"; });
    const inl = s => s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
                      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
                      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    let out = "", list = null;
    const close = () => { if (list){ out += "</" + list + ">"; list = null; } };
    for (const ln of t.split("\n")){
      let m;
      if ((m = ln.match(/^\s*[-*•]\s+(.*)/))){ if (list !== "ul"){ close(); out += "<ul>"; list = "ul"; } out += "<li>" + inl(m[1]) + "</li>"; }
      else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))){ if (list !== "ol"){ close(); out += "<ol>"; list = "ol"; } out += "<li>" + inl(m[1]) + "</li>"; }
      else if ((m = ln.match(/^#{1,4}\s+(.*)/))){ close(); out += "<h4>" + inl(m[1]) + "</h4>"; }
      else if (ln.trim() === ""){ close(); }
      else { close(); out += "<p>" + inl(ln) + "</p>"; }
    }
    close();
    return out.replace(/\u0000(\d+)\u0000/g, (m, i) => "<pre><code>" + blocks[i] + "</code></pre>");
  }

  // ---------- Tampilan ----------
  nameEl.value = store("ai_name") || "";
  function setMode(m){
    mode = MODES[m] ? m : "biasa"; store("ai_mode", mode);
    document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.mode === mode)));
    $("modehint").textContent = MODES[mode];
  }
  document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  setMode(store("ai_mode") || "biasa");

  function hero(){
    const n = nameEl.value.trim();
    log.innerHTML = "";
    const h = document.createElement("div"); h.className = "hero";
    h.innerHTML = '<div class="mark">✦</div><h2></h2><p>Mau ngobrol, tanya, atau analisis file hari ini?</p><div class="cards"></div>';
    h.querySelector("h2").textContent = n ? "Halo, " + n + "!" : "Halo!";
    [
      ["📚", "Jelaskan konsep", "Dengan bahasa sederhana", "Jelaskan dengan sederhana: "],
      ["📝", "Buat dokumen Word", "Laporan, surat, proposal", "Buatkan file Word tentang "],
      ["💻", "Bantu coding", "Tulis dan perbaiki kode", "Bantu aku membuat kode untuk "],
      ["📎", "Analisis lampiran", "PDF, Word, ZIP, foto", "Ringkas lampiran ini: "]
    ].forEach(c => {
      const b = document.createElement("button"); b.type = "button"; b.className = "card";
      b.innerHTML = '<span class="ci"></span><b></b><small></small>';
      b.querySelector(".ci").textContent = c[0]; b.querySelector("b").textContent = c[1]; b.querySelector("small").textContent = c[2];

  // ---------- File buatan AI (Word, PDF, ZIP, teks/kode) ----------
  const SUPPORTED = new Set("docx pdf txt md csv tsv json html htm css js jsx ts tsx py java c h cpp cs go rs rb php sql xml yml yaml sh bat log vue svelte".split(" "));
  function safeName(n){
    n = n.replace(/\\/g, "/").split("/").filter(p => p && p !== ".." && p !== ".")
      .map(p => p.replace(/[^\w.\- ()\u00C0-\u024F]/g, "_")).join("/").slice(0, 120) || "berkas.txt";
    if (!/\.[A-Za-z0-9]{1,6}$/.test(n)) n += ".txt";
    if (!SUPPORTED.has(n.split(".").pop().toLowerCase())) n += ".txt";
    return n;
  }
  function extractFiles(text){
    const files = [];
    const clean = text.replace(/\[\[FILE:\s*([^\]\n]+?)\s*\]\]\n?([\s\S]*?)(?:\[\[\/FILE\]\]|$)/g, (m, name, body) => {
      let b = body.replace(/\n$/, "");
      const fm = b.match(/^\s*```[\w-]*\n([\s\S]*?)\n?```\s*$/); if (fm) b = fm[1];
      files.push({ name: safeName(name), content: b });
      return "";
    });
    return { clean: clean.trim(), files };
  }
  const xmlEsc = s => s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  function docxRuns(text, base){
    return text.split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(p => {
      const bold = /^\*\*[^*]+\*\*$/.test(p), t = (bold ? p.slice(2, -2) : p).replace(/`/g, "");
      return "<w:r><w:rPr>" + ((bold || base.b) ? "<w:b/>" : "") + (base.sz ? '<w:sz w:val="' + base.sz + '"/>' : "") + '</w:rPr><w:t xml:space="preserve">' + xmlEsc(t) + "</w:t></w:r>";
    }).join("");
  }
  function docxBody(text){
    return text.split("\n").map(line => {
      let m;
      if ((m = line.match(/^#\s+(.*)/))) return '<w:p><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr>' + docxRuns(m[1], { b: 1, sz: 36 }) + "</w:p>";
      if ((m = line.match(/^##\s+(.*)/))) return '<w:p><w:pPr><w:spacing w:before="200" w:after="100"/></w:pPr>' + docxRuns(m[1], { b: 1, sz: 30 }) + "</w:p>";
      if ((m = line.match(/^###+\s+(.*)/))) return '<w:p><w:pPr><w:spacing w:before="160" w:after="80"/></w:pPr>' + docxRuns(m[1], { b: 1, sz: 26 }) + "</w:p>";
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))) return '<w:p><w:pPr><w:ind w:left="540" w:hanging="270"/></w:pPr>' + docxRuns("• " + m[1], {}) + "</w:p>";
      if ((m = line.match(/^\s*(\d+[.)])\s+(.*)/))) return '<w:p><w:pPr><w:ind w:left="540" w:hanging="360"/></w:pPr>' + docxRuns(m[1] + " " + m[2], {}) + "</w:p>";
      if (!line.trim()) return "<w:p/>";
      return "<w:p>" + docxRuns(line, {}) + "</w:p>";
    }).join("");
  }
  async function makeDocx(text){
    await loadScript(LIB.zip);
    const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"', HD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const z = new JSZip();
    z.file("[Content_Types].xml", HD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
    z.file("_rels/.rels", HD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    z.file("word/_rels/document.xml.rels", HD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    z.file("word/styles.xml", HD + "<w:styles " + NS + '><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="22"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>');
    z.file("word/document.xml", HD + "<w:document " + NS + "><w:body>" + docxBody(text) + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
    return z.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  }
  const pdfClean = s => s.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, "-").replace(/\u2022/g, "-").replace(/\u2026/g, "...").replace(/[^\x09\x0A\x20-\x7E\u00A0-\u00FF]/g, "");
  async function makePdf(text){
    await loadScript(LIB.jspdf);
    const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 56, maxW = W - 2 * M;
    let y = M;
    for (const raw of text.split("\n")){
      let line = pdfClean(raw), size = 11, style = "normal", indent = 0, m;
      if ((m = line.match(/^#\s+(.*)/))){ line = m[1]; size = 20; style = "bold"; }
      else if ((m = line.match(/^##\s+(.*)/))){ line = m[1]; size = 16; style = "bold"; }
      else if ((m = line.match(/^###+\s+(.*)/))){ line = m[1]; size = 13; style = "bold"; }
      else if ((m = line.match(/^\s*[-*]\s+(.*)/))){ line = "- " + m[1]; indent = 12; }
      line = line.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
      const lh = size * 1.4;
      if (!line.trim()){ y += lh * 0.6; continue; }
      doc.setFont("helvetica", style); doc.setFontSize(size);
      for (const part of doc.splitTextToSize(line, maxW - indent)){
        if (y + lh > H - M){ doc.addPage(); y = M; }
        doc.text(part, M + indent, y + size); y += lh;
      }
      if (style === "bold") y += 4;
    }
    return doc.output("blob");
  }
  async function fileBlob(f){
    const ext = f.name.split(".").pop().toLowerCase();
    if (ext === "docx") return makeDocx(f.content);
    if (ext === "pdf") return makePdf(f.content);
    return new Blob([ext === "csv" || ext === "tsv" ? "\ufeff" + f.content : f.content], { type: "text/plain;charset=utf-8" });
  }
  function saveBlob(blob, name){
    const u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = name.split("/").pop(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
  }
  function fileCards(files){
    const box = document.createElement("div"); box.className = "files";
    const icon = n => /\.docx$/.test(n) ? "📝" : /\.pdf$/.test(n) ? "📕" : "📄";

      const b = document.createElement("button"); b.type = "button"; b.textContent = label;
      b.onclick = async () => {
        b.disabled = true; const old = b.textContent; b.textContent = "Menyiapkan…";
        try { await action(); b.textContent = "Selesai ✓"; setTimeout(() => { b.textContent = old; b.disabled = false; }, 1800); }
        catch (e) { toast("Gagal membuat file: " + e.message); b.textContent = old; b.disabled = false; }

    files.forEach(f => box.appendChild(card(icon(f.name), f.name, fmt(new Blob([f.content]).size), "Unduh", "", async () => saveBlob(await fileBlob(f), f.name))));
    if (files.length > 1){
      box.appendChild(card("🗜", "Semua file (" + files.length + ")", "Dibundel jadi ZIP", "Unduh ZIP", "all", async () => {

        for (const f of files){
          let n = f.name; while (used.has(n)) n = "1_" + n; used.add(n);
          z.file(n, await fileBlob(f));

  // ---------- Lampiran: gambar, PDF, Word, ZIP, teks/kode ----------
  function renderAtt(){
    const box = $("att"); box.innerHTML = "";
    pending.forEach((a, i) => {
      const p = document.createElement("div"); p.className = "pill";
      if (a.kind === "image"){ const im = document.createElement("img"); im.src = a.dataUrl; im.alt = ""; p.appendChild(im); }
      const sp = document.createElement("span");
      sp.textContent = a.kind === "busy" ? "⏳ Membaca " + a.name + "…" : (a.kind === "image" ? "" : "📄 ") + a.name;
      p.appendChild(sp);

        const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Hapus lampiran");
        x.onclick = () => { pending.splice(i, 1); renderAtt(); };
        p.appendChild(x);
      }
      box.appendChild(p);
    });

  function shrinkImage(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1024 / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Gambar tidak bisa dibaca.")); };
      img.src = url;
    });
  }
  async function pdfText(file){
    await loadScript(LIB.pdf);
    pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
    const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = "";
    for (let i = 1; i <= doc.numPages && out.length < TEXT_LIMIT; i++){
      const tc = await (await doc.getPage(i)).getTextContent();
      out += "\n--- Halaman " + i + " ---\n" + tc.items.map(x => x.str).join(" ");
    }
    if (out.replace(/--- Halaman \d+ ---|\s/g, "").length < 30) throw new Error("PDF ini tampaknya hasil scan (berupa gambar), teksnya tidak bisa dibaca. Kirim halamannya sebagai gambar.");
    return out;
  }
  async function docxText(file){
    await loadScript(LIB.docx);
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    if (!r.value.trim()) throw new Error("Dokumen Word kosong atau tidak berisi teks.");
    return r.value;
  }
  async function zipText(file){
    await loadScript(LIB.zip);
    const z = await JSZip.loadAsync(await file.arrayBuffer());
    const names = Object.keys(z.files).filter(n => !z.files[n].dir);
    let out = "Isi ZIP (" + names.length + " file):\n" + names.slice(0, 300).join("\n") + (names.length > 300 ? "\n…" : "") + "\n";
    for (const n of names){
      if (out.length >= TEXT_LIMIT) break;
      if (!TEXT_EXT.test(n)) continue;
      const e = z.files[n];
      if (e._data && e._data.uncompressedSize > 1500000) continue;
      out += "\n=== " + n + " ===\n" + (await e.async("string")).slice(0, TEXT_LIMIT - out.length);
    }
    return out;
  }
  async function plainText(file){
    const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
    if (head.includes(0)) throw new Error("format biner tidak didukung. Gunakan gambar, PDF, Word (.docx), ZIP, atau file teks/kode.");
    return await file.text();
  }

  async function addFiles(files){
    for (const f of files){
      const isImg = f.type.startsWith("image/");
      if (isImg && pending.filter(a => a.kind === "image").length >= MAX_IMAGES){ toast("Maksimal " + MAX_IMAGES + " gambar per pesan."); continue; }
      if (f.size > MAX_FILE_MB * 1048576){ toast(f.name + ": terlalu besar (maks " + MAX_FILE_MB + " MB untuk dibaca di browser)."); continue; }
      const ph = { kind: "busy", name: f.name }; pending.push(ph); renderAtt();
      try {
        let item;
        if (isImg){ item = { kind: "image", name: f.name, dataUrl: await shrinkImage(f) }; }
        else {
          let text;
          if (/\.pdf$/i.test(f.name)) text = await pdfText(f);
          else if (/\.docx$/i.test(f.name)) text = await docxText(f);
          else if (/\.zip$/i.test(f.name)) text = await zipText(f);
          else if (/\.(doc|xls|xlsx|ppt|pptx|rar|7z)$/i.test(f.name)) throw new Error("format ini belum didukung. Simpan sebagai .docx, PDF, atau ZIP.");
          else text = await plainText(f);
          if (text.length > TEXT_LIMIT){ text = text.slice(0, TEXT_LIMIT) + "\n…(dipotong)"; toast(f.name + ": isi terlalu panjang, hanya " + TEXT_LIMIT.toLocaleString("id-ID") + " karakter pertama yang dikirim."); }
          item = { kind: "text", name: f.name, text: text };
        }
        pending.splice(pending.indexOf(ph), 1, item);
      } catch (e) {
        pending.splice(pending.indexOf(ph), 1);
        toast(f.name + ": " + e.message);
      }
      renderAtt();
    }
  }
  $("attach").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async (e) => { const fs = [...e.target.files]; e.target.value = ""; await addFiles(fs); });

  // ---------- Kirim ----------
  function buildContent(text, atts){
    let body = text, used = 0;
    atts.filter(a => a.kind === "text").forEach(a => {
      const t = a.text.slice(0, Math.max(0, TOTAL_TEXT_LIMIT - used)); used += t.length;
      body += "\n\n[File: " + a.name + "]\n" + t;
    });
    const imgs = atts.filter(a => a.kind === "image");
    if (!imgs.length) return body;
    return [{ type: "text", text: body || "Jelaskan gambar ini." }, ...imgs.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } }))];
  }
  function forRequest(){
    // Gambar hanya dikirim pada pesan terakhir supaya permintaan tidak membengkak.
    return history.map((m, i) => {
      if (Array.isArray(m.content) && i !== history.length - 1){
        return { role: m.role, content: m.content.filter(p => p.type === "text").map(p => p.text).join("\n") + "\n[gambar dilampirkan sebelumnya]" };
      }
      return m;
    });
  }

  const DOTS = '<span class="dots"><span></span><span></span><span></span></span>';

  // Membaca jawaban realtime (SSE) dari /api/chat dan menampilkannya sambil mengetik
  async function readStream(r, row){
    const reader = r.body.getReader(), dec = new TextDecoder(), m = row.querySelector(".msg");
    let buf = "", acc = "", queued = false;
    const paint = () => {
      queued = false;
      const { clean } = extractFiles(acc);
      m.innerHTML = md(clean) + (/\[\[FILE:/.test(acc) ? "<p>⏳ Menyusun file…</p>" : "");
      if (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140) scroller.scrollTop = scroller.scrollHeight;
    };
    for (;;){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const d = line.slice(5).trim();
        if (!d || d === "[DONE]") continue;
        let j; try { j = JSON.parse(d); } catch (e) { continue; }
        if (j.error) throw new Error(j.error);
        if (j.t){ acc += j.t; if (!queued){ queued = true; requestAnimationFrame(paint); } }
      }
    }
    return acc;
  }

  async function run(opts){
    opts = opts || {};
    const payload = JSON.stringify({ messages: forRequest(), model: modelSel.value, name: nameEl.value.trim(), mode, persona: $("persona").value, stream: $("stream").checked });
    const row = add("ai", "", { html: DOTS });
    send.disabled = true;
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload });
      let reply;
      if (r.ok && (r.headers.get("content-type") || "").includes("text/event-stream")){
        reply = await readStream(r, row);
      } else {
        const data = await r.json().catch(() => ({ error: r.status === 413 ? "Permintaan terlalu besar." : "Server tidak membalas dengan benar (cek folder api/ di Vercel)." }));
        if (!r.ok) throw new Error(data.error || "Terjadi kesalahan.");
        reply = data.reply;
      }
      reply = reply || "(jawaban kosong)";
      setReply(row, reply);
      history.push({ role: "assistant", content: reply });
      cur.view.push({ role: "assistant", text: reply });
      persist();
    } catch (e) {
      row.className = "row err";
      row.querySelector(".msg").textContent = e.message + " Coba kirim ulang atau ganti model.";
      if (!opts.keepUser && history.length && history[history.length - 1].role === "user"){
        history.pop();
        const lv = cur.view[cur.view.length - 1]; if (lv && lv.role === "user") cur.view.pop();
      }
    } finally {
      send.disabled = false; input.focus(); scroller.scrollTop = scroller.scrollHeight;
    }
  }

  function regen(){
    if (send.disabled || !history.length || history[history.length - 1].role !== "assistant") return;
    history.pop();
    if (cur.view.length && cur.view[cur.view.length - 1].role === "assistant") cur.view.pop();
    const rows = log.querySelectorAll(".row"), last = rows[rows.length - 1];
    if (last && !last.classList.contains("user")) last.remove();
    run({ keepUser: true });
  }

  async function ask(){
    const text = input.value.trim();
    if (pending.some(a => a.kind === "busy")){ toast("Tunggu, file masih dibaca…"); return; }
    if (editMode) return makeEdit(text);
    if (!text && !pending.length) return;
    if (imageMode) return makeImage(text);

    const atts = pending;
    history.push({ role: "user", content: buildContent(text, atts) });
    const size = JSON.stringify({ messages: forRequest() }).length;
    if (size > MAX_BODY){
      history.pop();
      toast("Lampiran + riwayat chat terlalu besar untuk sekali kirim (batas Vercel ±4,5 MB).\nKlik “＋ Chat baru” atau kurangi lampiran.");
      return;
    }
    cur.view.push({ role: "user", text, files: atts.map(a => a.name) });
    if (cur.title === "Chat baru"){ cur.title = (text || (atts[0] && atts[0].name) || "Chat").slice(0, 40); $("ttl").textContent = cur.title; }
    pending = []; renderAtt(); input.value = ""; input.style.height = "auto";
    add("user", text, { atts });
    await run();
  }

  // ---------- Buat & edit gambar (opsional) ----------
  function showImage(row, data, alt){
    const src = data.b64 ? "data:image/png;base64," + data.b64 : (/^https:\/\//.test(data.url || "") ? data.url : "");
    if (!src) throw new Error("Tidak ada gambar yang dikembalikan.");
    const m = row.querySelector(".msg"); m.textContent = "";
    const img = document.createElement("img"); img.className = "gen"; img.src = src; img.alt = alt;
    const dl = document.createElement("a"); dl.href = src; dl.download = "gambar.png"; dl.target = "_blank"; dl.rel = "noopener";
    dl.textContent = "Buka / unduh gambar"; dl.style.cssText = "display:inline-block;margin-top:8px;font-size:.85rem;color:var(--accent)";
    m.append(img, dl);
  }
  async function callImage(url, payload, prompt, atts){
    input.value = ""; input.style.height = "auto";
    add("user", prompt, { atts });
    const row = add("ai", "", { html: DOTS });
    send.disabled = true;
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await r.json().catch(() => ({ error: r.status === 413 ? "Gambar terlalu besar." : "Server tidak membalas dengan benar." }));
      if (!r.ok) throw new Error(data.error || "Gagal memproses gambar.");
      showImage(row, data, prompt);
    } catch (e) {
      row.className = "row err"; row.querySelector(".msg").textContent = e.message;
    } finally {
      send.disabled = false; input.focus(); scroller.scrollTop = scroller.scrollHeight;
    }
  }
  function makeImage(prompt){
    if (!prompt) return;
    return callImage("/api/image", { prompt, size: $("size").value }, prompt);
  }
  function makeEdit(prompt){
    const img = pending.find(a => a.kind === "image");
    if (!img){ toast("Lampirkan gambar yang mau diedit dulu (tombol 📎)."); return; }
    if (!prompt){ toast("Tulis instruksi edit, misalnya “ganti latar jadi pantai”."); return; }
    pending = []; renderAtt();
    return callImage("/api/image-edit", { prompt, image: img.dataUrl, model: $("editModel").value, size: $("size").value }, prompt, [img]);
  }

  SIZES.forEach(z => { const o = document.createElement("option"); o.value = z; o.textContent = z; $("size").appendChild(o); });
  $("size").value = "1024x1024";

  function setTool(t){
    imageMode = t === "image"; editMode = t === "edit";
    $("imgmode").classList.toggle("on", imageMode);
    $("editmode").classList.toggle("on", editMode);
    $("sizeBox").classList.toggle("hide", t === "chat");
    $("editBox").classList.toggle("hide", t !== "edit");
    input.placeholder = t === "image" ? "Deskripsikan gambar yang ingin dibuat…" : t === "edit" ? "Lampirkan gambar, lalu tulis perubahan yang diinginkan…" : "Tulis pesan…";
    if (t !== "chat") $("panel").classList.remove("hide");
  }
  $("imgmode").addEventListener("click", () => setTool(imageMode ? "chat" : "image"));
  $("editmode").addEventListener("click", () => setTool(editMode ? "chat" : "edit"));

  fetch("/api/image").then(r => r.json()).then(d => { if (d.enabled) $("imgmode").classList.remove("hide"); }).catch(() => {});
  fetch("/api/image-edit").then(r => r.json()).then(d => {
    if (!d.enabled) return;
    $("editmode").classList.remove("hide");
    d.models.forEach(id => { const o = document.createElement("option"); o.value = id; o.textContent = "✏️ " + id; $("editModel").appendChild(o); });
  }).catch(() => {});

  // ---------- Model & pengaturan ----------
  $("stream").checked = store("ai_stream") !== "0";
  $("stream").addEventListener("change", () => store("ai_stream", $("stream").checked ? "1" : "0"));
  fetch("/api/models").then(r => r.json()).then(d => {
    if (!d.models || !d.models.length) return;
    if (d.live) $("legend").textContent += " · Daftar model diperbarui langsung dari BankAI.";
    modelSel.innerHTML = "";
    const groups = {};
    d.models.forEach(m => {
      if (!groups[m.group]){ groups[m.group] = document.createElement("optgroup"); groups[m.group].label = m.group; modelSel.appendChild(groups[m.group]); }
      const o = document.createElement("option"); o.value = m.id; o.textContent = m.label; o.disabled = !m.available;
      groups[m.group].appendChild(o);
    });
    const saved = store("ai_model");
    const ok = [...modelSel.options].find(o => o.value === saved && !o.disabled);
    modelSel.value = ok ? saved : "auto-FREE";
    refreshSub();
  }).catch(() => {});
  modelSel.addEventListener("change", () => { store("ai_model", modelSel.value); refreshSub(); });
  nameEl.addEventListener("input", () => { store("ai_name", nameEl.value); if (log.querySelector(".hero")) hero(); });
  $("gear").addEventListener("click", () => {
    const open = $("panel").classList.toggle("hide") === false;
    $("gear").setAttribute("aria-expanded", String(open));
  });

  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); ask(); } });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 150) + "px"; });
  // ---------- Peran, tema, warna ----------
  function refreshSub(){ const p = $("persona"); sub.textContent = modelSel.value + " · " + p.options[p.selectedIndex].text; }
  $("persona").value = store("ai_persona") || "umum";
  $("persona").addEventListener("change", () => { store("ai_persona", $("persona").value); refreshSub(); });

  const ACCENTS = { teal: ["#0d9488", "#2dd4bf"], biru: ["#2563eb", "#60a5fa"], ungu: ["#7c3aed", "#a78bfa"], oranye: ["#ea580c", "#fb923c"], pink: ["#db2777", "#f472b6"] };
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  function applyTheme(){
    const t = store("ai_theme") || "auto";
    document.documentElement.dataset.theme = t;
    const dark = t === "dark" || (t === "auto" && darkMQ.matches);
    const a = ACCENTS[store("ai_accent")] || ACCENTS.teal;
    document.documentElement.style.setProperty("--accent", dark ? a[1] : a[0]);
    document.documentElement.style.setProperty("--accent-ink", dark ? "#0b1020" : "#ffffff");
    document.querySelectorAll("#swatches button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.k === (store("ai_accent") || "teal"))));
  }
  Object.keys(ACCENTS).forEach(k => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.k = k; b.setAttribute("role", "radio");
    b.setAttribute("aria-label", "Warna " + k); b.style.background = ACCENTS[k][0];
    b.onclick = () => { store("ai_accent", k); applyTheme(); };
    $("swatches").appendChild(b);
  });
  $("theme").value = store("ai_theme") || "auto";
  $("theme").addEventListener("change", () => { store("ai_theme", $("theme").value); applyTheme(); });
  if (darkMQ.addEventListener) darkMQ.addEventListener("change", applyTheme);

  // ---------- Riwayat chat (disimpan di browser) ----------
  const HKEY = "ai_convs_v1";
  function loadConvs(){
    try { convs = JSON.parse(localStorage.getItem(HKEY) || "[]"); if (!Array.isArray(convs)) convs = []; } catch (e) { convs = []; }
  }
  function writeConvs(){
    for (;;){
      try { localStorage.setItem(HKEY, JSON.stringify(convs)); return; }
      catch (e) { if (convs.length <= 1) return; convs.pop(); } // penyimpanan penuh: buang yang terlama
    }
  }
  function persist(){
    if (!cur || !cur.view.length) return;
    const slim = {
      id: cur.id, title: cur.title, t: Date.now(), view: cur.view.slice(-60),
      history: cur.history.slice(-20).map(m => ({
        role: m.role,
        content: typeof m.content === "string" ? m.content.slice(0, m.role === "user" ? 8000 : 20000)
          : m.content.filter(p => p.type === "text").map(p => p.text).join("\n").slice(0, 8000) + "\n[gambar dilampirkan]"
      }))
    };
    const i = convs.findIndex(c => c.id === cur.id);
    if (i >= 0) convs[i] = slim; else convs.unshift(slim);
    convs.sort((a, b) => b.t - a.t); convs = convs.slice(0, 30);
    writeConvs(); renderHist();
  }
  function renderHist(){
    const box = $("hist"); box.innerHTML = "";
    if (!convs.length){ const e = document.createElement("div"); e.className = "empty-h"; e.textContent = "Belum ada riwayat."; box.appendChild(e); return; }
    convs.forEach(c => {
      const r = document.createElement("div"); r.className = "hi" + (cur && c.id === cur.id ? " active" : "");
      const t = document.createElement("button"); t.type = "button"; t.className = "ht"; t.textContent = c.title; t.title = c.title; t.onclick = () => openConv(c.id);
      const d = document.createElement("button"); d.type = "button"; d.className = "hd"; d.textContent = "×"; d.setAttribute("aria-label", "Hapus percakapan");
      d.onclick = () => { convs = convs.filter(x => x.id !== c.id); writeConvs(); if (cur && cur.id === c.id) newConv(); else renderHist(); };
      r.append(t, d); box.appendChild(r);
    });
  }
  function setCur(c){ cur = c; history = c.history; }
  function newConv(){
    setCur({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "Chat baru", history: [], view: [] });
    pending = []; renderAtt(); $("ttl").textContent = cur.title; hero(); renderHist(); closeSide();
  }
  function openConv(id){
    const c = convs.find(x => x.id === id); if (!c) return;
    setCur({ id: c.id, title: c.title, history: c.history.slice(), view: c.view.slice() });
    pending = []; renderAtt(); $("ttl").textContent = c.title; log.innerHTML = "";
    c.view.forEach(v => {
      if (v.role === "user") add("user", v.text, { atts: (v.files || []).map(n => ({ kind: "text", name: n })) });
      else setReply(add("ai", ""), v.text);
    });
    if (!c.view.length) hero();
    renderHist(); closeSide(); scroller.scrollTop = scroller.scrollHeight;
  }
  const side = $("side"), scrim = $("scrim");
  function openSide(){ side.classList.add("open"); scrim.classList.remove("hide"); }
  function closeSide(){ side.classList.remove("open"); scrim.classList.add("hide"); }
  $("menu").addEventListener("click", openSide);
  scrim.addEventListener("click", closeSide);
  $("reset").addEventListener("click", newConv);
  $("newTop").addEventListener("click", newConv);
  $("clearall").addEventListener("click", () => {
    if (!convs.length || !confirm("Hapus semua riwayat chat di perangkat ini?")) return;
    convs = []; writeConvs(); newConv();
  });
  $("export").addEventListener("click", () => {
    if (!cur || !cur.view.length){ toast("Belum ada percakapan untuk diekspor."); return; }
    const md = "# " + cur.title + "\n\n" + cur.view.map(v => (v.role === "user" ? "**Kamu:** " : "**AI:** ") + v.text).join("\n\n---\n\n");
    saveBlob(new Blob([md], { type: "text/markdown" }), "chat.md");
  });

  // ---------- Dikte suara ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR){
    $("mic").classList.remove("hide");
    let rec = null, on = false;
    $("mic").addEventListener("click", () => {
      if (on && rec){ rec.stop(); return; }
      rec = new SR(); rec.lang = "id-ID"; rec.interimResults = true; rec.continuous = false;
      const base = input.value;
      rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; input.value = (base ? base + " " : "") + t; input.dispatchEvent(new Event("input")); };
      rec.onend = () => { on = false; $("mic").classList.remove("rec"); };
      rec.onerror = (ev) => toast("Mikrofon: " + (ev.error === "not-allowed" ? "izin ditolak." : ev.error));
      on = true; $("mic").classList.add("rec"); rec.start();
    });
  }


  applyTheme(); loadConvs(); newConv(); refreshSub();
</script>
</body>
</html>
